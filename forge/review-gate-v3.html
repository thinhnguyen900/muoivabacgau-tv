<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bác Gấu Phase 2 · Visual V3</title>
<style>
html,body{margin:0;background:#100e0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial;height:100%}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;box-sizing:border-box}.stage{position:relative;overflow:hidden;border-radius:24px;background:#17120e;min-height:calc(100vh - 32px)}#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}.badge{position:absolute;left:20px;top:20px;padding:10px 14px;border-radius:999px;background:#120f0ccc;font-weight:800;z-index:3}.bubble{position:absolute;left:24px;right:24px;bottom:24px;background:#120f0cdd;border:1px solid #ffffff1c;border-radius:18px;padding:16px 18px;font-size:22px;z-index:3;backdrop-filter:blur(12px)}.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin-top:0}.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:10px 0}.ok{color:#8fd197}button{width:100%;padding:14px;border:0;border-radius:14px;background:#e0b568;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer}audio{width:100%;margin:8px 0 16px}#scenarioAudio{display:none}.state{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cdbfae;white-space:pre-wrap;max-height:180px;overflow:auto}.mini{font-size:12px;color:#aa9d8c;margin-top:6px}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{min-height:68vh}.side{border-radius:18px}}
</style></head>
<body><div class="app"><section class="stage" id="stage"><div class="badge">BODY ↔ BRAIN · visual v3</div><div class="bubble" id="bubble">Bác đang nghe Muối nè.</div></section><aside class="side"><h1>Bác Gấu Phase 2</h1><div class="gate" id="visualStatus">3D: đang khởi tạo…</div><div class="mini">Visual pass v3: mắt có lòng trắng + iris, chân mày mềm, tỉ lệ đầu/mõm chỉnh lại, ánh sáng ấm hơn.</div><button id="viBtn">🔊 Test tiếng Việt</button><audio id="viAudio" controls preload="auto" src="./assets/vi-test.mp3"></audio><button id="enBtn">🔊 Test English</button><audio id="enAudio" controls preload="auto" src="./assets/en-test.mp3"></audio><audio id="scenarioAudio" preload="auto"></audio><button data-state="welcoming">🏠 Muối về</button><button data-state="gentle">😔 Con buồn</button><button data-state="thinking">🤔 Hỏi khó</button><button data-state="playful">🦖 Khủng long</button><div class="state" id="stateDump">state=booting</div></aside></div>
<script src="./brain.js"></script><script src="./liveness.js"></script><script type="module">
import * as THREE from './three.module.js';
const stage=document.getElementById('stage'),bubble=document.getElementById('bubble'),stateDump=document.getElementById('stateDump'),visualStatus=document.getElementById('visualStatus'),viAudio=document.getElementById('viAudio'),enAudio=document.getElementById('enAudio'),scenarioAudio=document.getElementById('scenarioAudio');
viBtn.onclick=()=>{scenarioAudio.pause();viAudio.currentTime=0;viAudio.play()};enBtn.onclick=()=>{scenarioAudio.pause();enAudio.currentTime=0;enAudio.play()};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x211a14);scene.fog=new THREE.Fog(0x211a14,12,28);const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,3.35,10.6);camera.lookAt(-.4,2.15,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe5c7,0x2d241d,2.25));const key=new THREE.DirectionalLight(0xffd0a3,3.2);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.PointLight(0xffb875,8,9,2);fill.position.set(3.7,3.6,2.2);scene.add(fill);const rim=new THREE.DirectionalLight(0xffead4,1.2);rim.position.set(4,5,-4);scene.add(rim);
function mat(color,rough=.76){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:0})}function sphere(rx,ry,rz,color,rough=.82,seg=48){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(24,seg/2)),mat(color,rough));m.scale.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;return m}function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,.9));m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m}
box(15,.25,12,0x5a3b2a,0,-.12,0);box(15,7,.2,0x352c25,0,3,-4.9);const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.05,64),mat(0x7a3b37,1));rug.scale.z=.68;rug.position.set(-.5,.05,.7);rug.receiveShadow=true;scene.add(rug);box(2.9,3.7,.62,0x68482e,-5.2,1.85,-4.25);box(4,.75,1.5,0x34423d,2.5,.5,-2.2);box(4,1.3,.58,0x2c3835,2.5,1.28,-2.55);box(2.5,.18,1.25,0x825534,.4,1.02,1.75);box(.16,1,.16,0x4d311e,-.5,.5,1.4);box(.16,1,.16,0x4d311e,1.3,.5,1.4);
function createBear(){const g=new THREE.Group();g.position.set(-1.15,0,.1);const fur=0x85502f,fur2=0x9a6037,muzzle=0xd39b68,dark=0x2a170d,sclera=0xf5ead8,iris=0x6b3c1d,pupil=0x120b07,pink=0xc98164;const torso=new THREE.Group();g.add(torso);const body=sphere(1.12,1.42,.88,fur);body.position.y=1.48;torso.add(body);const chest=sphere(.68,.86,.56,fur2);chest.position.set(0,1.53,.58);torso.add(chest);const neck=sphere(.70,.45,.60,fur);neck.position.set(0,2.55,.03);torso.add(neck);const headRig=new THREE.Group();headRig.position.set(0,3.23,.06);g.add(headRig);const head=sphere(1.02,.93,.88,fur);headRig.add(head);const cheekL=sphere(.40,.36,.34,fur2);cheekL.position.set(-.42,-.18,.54);headRig.add(cheekL);const cheekR=cheekL.clone();cheekR.position.x=.42;headRig.add(cheekR);
const earL=sphere(.36,.37,.22,fur);earL.position.set(-.70,.70,-.03);headRig.add(earL);const earR=earL.clone();earR.position.x=.70;headRig.add(earR);const earInL=sphere(.20,.21,.08,pink);earInL.position.set(-.70,.70,.16);headRig.add(earInL);const earInR=earInL.clone();earInR.position.x=.70;headRig.add(earInR);
const snout=sphere(.55,.37,.35,muzzle);snout.position.set(0,-.20,.77);headRig.add(snout);const jaw=sphere(.40,.16,.27,muzzle);jaw.position.set(0,-.46,.79);headRig.add(jaw);const nose=sphere(.18,.13,.11,dark,.45);nose.position.set(0,-.03,1.06);headRig.add(nose);
function eye(x){const rig=new THREE.Group();rig.position.set(x,.25,.78);const white=sphere(.19,.23,.09,sclera,.45,32);rig.add(white);const irisM=sphere(.092,.105,.055,iris,.35,28);irisM.position.set(0,-.005,.075);rig.add(irisM);const pup=sphere(.052,.062,.035,pupil,.28,24);pup.position.set(0,-.005,.118);rig.add(pup);const gl=new THREE.Mesh(new THREE.SphereGeometry(.018,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));gl.position.set(-.025,.035,.145);rig.add(gl);headRig.add(rig);return {rig,white,irisM,pup,gl};}
const eL=eye(-.34),eR=eye(.34);const browMat=mat(0x4a2716,.72);function brow(x,flip){const b=new THREE.Mesh(new THREE.CapsuleGeometry(.045,.24,5,10),browMat);b.position.set(x,.56,.90);b.rotation.z=flip*.92;headRig.add(b);return b}const browL=brow(-.34,1),browR=brow(.34,-1);
const mouth=new THREE.Mesh(new THREE.TorusGeometry(.18,.026,12,32,Math.PI),mat(dark,.5));mouth.position.set(0,-.39,1.07);mouth.rotation.z=Math.PI;headRig.add(mouth);const mouthOpen=sphere(.16,.045,.05,0x4b1815,.5,28);mouthOpen.position.set(0,-.49,1.05);headRig.add(mouthOpen);mouthOpen.visible=false;
const shoulderL=sphere(.42,.40,.50,fur);shoulderL.position.set(-.83,2.08,.02);torso.add(shoulderL);const shoulderR=shoulderL.clone();shoulderR.position.x=.83;torso.add(shoulderR);const armL=sphere(.34,.78,.37,fur);armL.position.set(-1.00,1.55,.08);armL.rotation.z=-.12;torso.add(armL);const armR=armL.clone();armR.position.x=1.00;armR.rotation.z=.12;torso.add(armR);const pawL=sphere(.31,.24,.34,fur2);pawL.position.set(-1.08,.95,.18);torso.add(pawL);const pawR=pawL.clone();pawR.position.x=1.08;torso.add(pawR);const footL=sphere(.45,.30,.56,fur);footL.position.set(-.48,.34,.12);torso.add(footL);const footR=footL.clone();footR.position.x=.48;torso.add(footR);
g.userData={torso,headRig,armL,armR,pawL,pawR,jaw,mouth,mouthOpen,eL,eR,browL,browR,nextBlink:2,blink:0,gazeX:0,gazeY:0};return g}
const bear=createBear();scene.add(bear);const stateText={welcoming:'Ủa! Muối về rồi à? Bác mừng con về.',gentle:'Ừ, bác nghe đây. Con kể từ từ cũng được.',thinking:'Hừm… câu này hay đó. Bác nghĩ một chút nha.',playful:'Ồ, khủng long hả? Bác tò mò rồi đó!'};const stateAudio={welcoming:'./assets/scenario-welcoming.mp3',gentle:'./assets/scenario-gentle.mp3',thinking:'./assets/scenario-thinking.mp3',playful:'./assets/scenario-playful.mp3'};let state='listening',speaking=false,plan=BacGauLiveness.plan({performance:'listening',turn:0,text:'boot',speaking:false});function refresh(){plan=BacGauLiveness.plan({performance:state,turn:Math.floor(performance.now()),text:stateText[state]||'listening',speaking});stateDump.textContent=JSON.stringify(plan,null,2)}async function playScenario(k){viAudio.pause();enAudio.pause();scenarioAudio.pause();scenarioAudio.src=stateAudio[k];scenarioAudio.currentTime=0;speaking=true;state=k;bubble.textContent=stateText[k];refresh();try{await scenarioAudio.play()}catch(e){speaking=false;refresh()}}scenarioAudio.onended=()=>{speaking=false;refresh()};document.querySelectorAll('[data-state]').forEach(btn=>btn.onclick=()=>playScenario(btn.dataset.state));
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);const clock=new THREE.Clock();let frames=0;function animate(){const t=clock.getElapsedTime(),u=bear.userData,breath=.5+.5*Math.sin(t*1.45);u.torso.scale.y=1+.009*breath;bear.position.y=.012*Math.sin(t*1.15);u.headRig.rotation.z=.008*Math.sin(t*.72);u.headRig.rotation.y=.015*Math.sin(t*.52);if(t>u.nextBlink){u.blink=1;u.nextBlink=t+3+Math.random()*3.8}u.blink=Math.max(0,u.blink-.11);const b=Math.sin(Math.PI*u.blink);u.eL.rig.scale.y=1-.78*b;u.eR.rig.scale.y=1-.78*b;const tx=state==='thinking'?.025:state==='playful'?.025*Math.sin(t*1.8):0,ty=state==='gentle'?-.015:state==='thinking'?.015:0;u.gazeX+=(tx-u.gazeX)*.07;u.gazeY+=(ty-u.gazeY)*.07;[u.eL,u.eR].forEach((e,i)=>{e.irisM.position.x=u.gazeX;e.pup.position.x=u.gazeX;e.gl.position.x=-.025+u.gazeX;e.irisM.position.y=-.005+u.gazeY;e.pup.position.y=-.005+u.gazeY;e.gl.position.y=.035+u.gazeY});const talk=speaking?(.5+.5*Math.abs(Math.sin(t*10.5))):0;u.mouthOpen.visible=talk>.18;u.mouthOpen.scale.y=.45+.85*talk;u.jaw.position.y=-.46-.035*talk;u.browL.rotation.z=.92;u.browR.rotation.z=-.92;if(state==='welcoming'){u.headRig.rotation.y=.08+.018*Math.sin(t*2);u.armL.rotation.z=-.28+.05*Math.sin(t*2.4);u.browL.position.y=.59;u.browR.position.y=.59}else if(state==='gentle'){u.headRig.rotation.x=-.06;u.headRig.rotation.z=.035;u.browL.rotation.z=.78;u.browR.rotation.z=-.78}else if(state==='thinking'){u.headRig.rotation.z=.045;u.browL.rotation.z=.68;u.browR.rotation.z=-1.08}else if(state==='playful'){u.headRig.rotation.y=.04*Math.sin(t*2.4);u.armL.rotation.z=-.22+.09*Math.sin(t*2.8);u.armR.rotation.z=.22-.08*Math.sin(t*2.5)}else{u.headRig.rotation.x*=.94;u.armL.rotation.z*=.94;u.armR.rotation.z*=.94}renderer.render(scene,camera);frames++;if(frames===2){visualStatus.innerHTML='<span class="ok">✓ WebGL visual v3 rendered · friendly face pass</span>';window.__BACGAU_READY__=true}requestAnimationFrame(animate)}animate();
</script></body></html>
