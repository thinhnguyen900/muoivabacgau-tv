<!doctype html>
<html lang="vi">
<head>

<style>

.badge,.bubble{position:absolute;z-index:3;background:#120f0ccc;backdrop-filter:blur(12px)}
.badge{left:20px;top:20px;padding:10px 14px;border-radius:999px;font-weight:800}
.bubble{left:24px;right:24px;bottom:24px;border:1px solid #ffffff1c;border-radius:18px;padding:16px 18px;font-size:22px}
.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin-top:0}
.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:10px 0}.ok{color:#8fd197}.warn{color:#f1c56c}.err{color:#ff8a80}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#e0b568;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer}
button:active{transform:translateY(1px)}audio{width:100%;margin:8px 0 16px}#scenarioAudio{display:none}
.state{font:12px ui-monospace;white-space:pre-wrap;max-height:220px;overflow:auto;color:#cdbfae}.mini{font-size:12px;color:#aa9d8c}

</style>
</head>
<body>
<div class="app">

<aside class="side">
<h1>Bác Gấu Phase 2</h1>

<audio id="enAudio" controls preload="auto" playsinline src="https://bacgau-pass82-safari-full.vercel.app/api/asset?name=en-test.mp3"></audio>

</aside>
</div>
<script>

<script type="module">
import * as THREE from './three.module.js';

const $=s=>document.querySelector(s),stage=$('#stage'),bubble=$('#bubble'),stateDump=$('#stateDump'),visualStatus=$('#visualStatus'),viAudio=$('#viAudio'),enAudio=$('#enAudio'),scenarioAudio=$('#scenarioAudio');
const audios=[viAudio,enAudio,scenarioAudio];

const furMat=c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.83,metalness:0,sheen:.48,sheenRoughness:.82,sheenColor:new THREE.Color(c).offsetHSL(0,.02,.08),clearcoat:.012,clearcoatRoughness:.92});

const eyeWhiteMat=new THREE.MeshPhysicalMaterial({color:0xf4eadc,roughness:.18,clearcoat:1,clearcoatRoughness:.10});

box(15,.18,12,0x493126,0,-.12,0);for(let i=-7;i<=7;i++)box(.76,.018,11.5,[0x6a4733,0x573828,0x74503a][(i+7)%3],i*.79,.005,.15,.9);

box(.07,2.0,.07,0x563b2d,5.45,1.18,-2.9);const lamp=new THREE.Mesh(new THREE.ConeGeometry(.46,.54,28,1,true),softMat(0xd19a64,.84));lamp.position.set(5.45,2.42,-2.9);lamp.rotation.x=Math.PI;scene.add(lamp);const lampGlow=new THREE.PointLight(0xffa65f,1.7,4.5,2);lampGlow.position.set(5.45,2.18,-2.5);scene.add(lampGlow);

  const crown=E(.77,.44,.55,fur2);crown.position.set(0,.43,-.01);headRig.add(crown);
  const facePatch=E(.79,.70,.64,furLight);facePatch.position.set(0,-.05,.42);headRig.add(facePatch);

  const ears=[];

    const er=new THREE.Group();er.position.set(q*.70,.60,-.01);headRig.add(er);ears.push(er);

  }

  for(const q of [-1,1]){const c=E(.33,.27,.19,muzzle2);c.position.set(q*.27,-.31,.83);headRig.add(c)}
  const muzzleBase=E(.52,.36,.29,muzzle);muzzleBase.position.set(0,-.34,.84);headRig.add(muzzleBase);
  const bridge=E(.27,.20,.16,muzzle2);bridge.position.set(0,-.19,1.00);headRig.add(bridge);
  const nose=E(.17,.105,.085,dark,40);nose.position.set(0,-.16,1.12);headRig.add(nose);
  const noseHi=E(.047,.022,.014,new THREE.MeshBasicMaterial({color:0xb98f7b}),20);noseHi.position.set(-.042,-.12,1.19);noseHi.castShadow=false;headRig.add(noseHi);

  function eye(x){
    const root=new THREE.Group();root.position.set(x,.18,.90);headRig.add(root);
    const white=E(.185,.150,.066,eyeWhiteMat,48);white.castShadow=false;root.add(white);

    const iris=E(.104,.104,.026,irisMat,36);iris.castShadow=false;look.add(iris);
    const pupil=E(.055,.064,.016,pupilMat,32);pupil.position.z=.024;pupil.castShadow=false;look.add(pupil);
    const glint=E(.016,.016,.008,new THREE.MeshBasicMaterial({color:0xffffff}),14);glint.position.set(-.032,.034,.042);glint.castShadow=false;look.add(glint);
    const glint2=E(.006,.006,.004,new THREE.MeshBasicMaterial({color:0xffd6b8}),10);glint2.position.set(.025,-.015,.043);glint2.castShadow=false;look.add(glint2);
    const upper=E(.205,.105,.040,fur,36);upper.position.set(0,.165,.083);upper.castShadow=false;root.add(upper);
    const lower=E(.205,.070,.039,furLight,36);lower.position.set(0,-.165,.080);lower.castShadow=false;root.add(lower);
    return{root,look,upper,lower};
  }
  const eyeL=eye(-.30),eyeR=eye(.30);

  function brow(x,sign){const root=new THREE.Group();root.position.set(x,.46,1.00);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.032,.032,.34,16),softMat(0x4a3027,.78));mesh.rotation.z=Math.PI/2;root.add(mesh);root.rotation.z=sign*.05;headRig.add(root);return root}
  const browL=brow(-.30,1),browR=brow(.30,-1);

  const mouthGroup=new THREE.Group();headRig.add(mouthGroup);
  const mouth=E(.245,.060,.034,mouthMat,36);mouth.position.set(0,-.50,1.085);mouth.castShadow=false;mouthGroup.add(mouth);
  const tongue=E(.135,.030,.020,tongueMat,28);tongue.position.set(0,-.526,1.116);tongue.castShadow=false;mouthGroup.add(tongue);
  const lipMat=softMat(0x4b2720,.62);
  const smileL=tube(new THREE.Vector3(-.01,-.475,1.115),new THREE.Vector3(-.12,-.535,1.125),new THREE.Vector3(-.235,-.485,1.10),lipMat,.014);headRig.add(smileL);
  const smileR=tube(new THREE.Vector3(.01,-.475,1.115),new THREE.Vector3(.12,-.535,1.125),new THREE.Vector3(.235,-.485,1.10),lipMat,.014);headRig.add(smileR);
  const jawRig=new THREE.Group();jawRig.position.set(0,-.49,.92);headRig.add(jawRig);
  const jaw=E(.31,.15,.15,muzzle);jawRig.add(jaw);
  const chin=E(.20,.085,.11,furLight);chin.position.set(0,-.10,-.03);jawRig.add(chin);

  for(const q of [-1,1]){const shoulder=E(.43,.39,.44,fur);shoulder.position.set(q*.76,2.03,.00);torso.add(shoulder)}
  function arm(q){const rig=new THREE.Group();rig.position.set(q*.80,2.03,.04);torso.add(rig);const upper=E(.27,.58,.29,fur);upper.position.set(q*.03,-.40,.02);rig.add(upper);const fore=E(.25,.50,.27,fur2);fore.position.set(q*.10,-.91,.13);rig.add(fore);const paw=E(.31,.27,.32,furLight);paw.position.set(q*.14,-1.32,.25);rig.add(paw);const palm=E(.20,.105,.17,muzzle);palm.position.set(q*.15,-1.33,.50);rig.add(palm);return rig}
  const armL=arm(-1),armR=arm(1);
  for(const q of [-1,1]){const thigh=E(.44,.47,.43,fur);thigh.position.set(q*.44,.64,-.01);torso.add(thigh);const foot=E(.40,.23,.49,fur2);foot.position.set(q*.46,.21,.24);torso.add(foot);const pad=E(.23,.075,.22,muzzle);pad.position.set(q*.46,.18,.57);torso.add(pad)}

  g.userData={torso,headRig,armL,armR,eyeL,eyeR,browL,browR,mouth,tongue,jawRig,smileL,smileR,ears,blinkStart:-99,nextBlink:1.8,gazeX:0,gazeY:0,saccadeX:0,saccadeY:0,nextSaccade:.9};
  return g;
}

const b=makeBear();scene.add(b);
const text={listening:'Bác đang xếp sách. Bác chưa biết Muối đã về.',welcoming:'Ủa! Muối về rồi à? Bác mừng con về.',gentle:'Ừ, bác nghe đây. Con kể từ từ cũng được.',thinking:'Hừm… câu này hay đó. Bác nghĩ một chút nha.',playful:'Ồ, khủng long hả? Bác tò mò rồi đó!'};
const aud={welcoming:'https://bacgau-pass82-safari-full.vercel.app/api/asset?name=scenario-welcoming.mp3',gentle:'https://bacgau-pass82-safari-full.vercel.app/api/asset?name=scenario-gentle.mp3',thinking:'https://bacgau-pass82-safari-full.vercel.app/api/asset?name=scenario-thinking.mp3',playful:'https://bacgau-pass82-safari-full.vercel.app/api/asset?name=scenario-playful.mp3'};
let state='listening',speaking=false,activeAudio=scenarioAudio,stateSince=performance.now()/1000,plan=BacGauLiveness.plan({performance:'listening',turn:0,text:'boot',speaking:false});
function refresh(){plan=BacGauLiveness.plan({performance:state,turn:Math.floor(performance.now()),text:text[state]||'listening',speaking});stateDump.textContent=JSON.stringify({state,gesture:plan.gesture,eyeOpen:plan.eyeOpen,headTilt:plan.headTilt,armOpenness:plan.armOpenness,speaking,audio:activeAudio?.id||null},null,2);window.__BACGAU_SPEAKING__=speaking}
function apply(k){state=k;stateSince=performance.now()/1000;bubble.textContent=text[k]||text.listening;stage.dataset.state=k;refresh()}
function stopOthers(keep){for(const a of audios)if(a!==keep){a.pause();a.currentTime=0}}
async function playAudio(audio,{stateName=null,bubbleText=null}={}){stopOthers(audio);activeAudio=audio;if(stateName)apply(stateName);else if(bubbleText)bubble.textContent=bubbleText;audio.currentTime=0;try{await audio.play();window.__BACGAU_SCENARIO_AUDIO__={state:stateName||'sample',src:audio.currentSrc||audio.src,played:true}}catch(e){speaking=false;visualStatus.innerHTML='<span class="warn">Safari chưa cho phát audio: '+(e?.name||'play failed')+'</span>';refresh()}}
for(const a of audios){a.addEventListener('playing',()=>{activeAudio=a;speaking=true;refresh()});a.addEventListener('pause',()=>{if(a===activeAudio&&!a.ended){speaking=false;refresh()}});a.addEventListener('ended',()=>{if(a===activeAudio){speaking=false;refresh()}});a.addEventListener('error',()=>{visualStatus.innerHTML='<span class="warn">Audio lỗi tải: '+(a.id||'unknown')+'</span>'})}
$('#viBtn').onclick=()=>playAudio(viAudio,{bubbleText:'Bác đang test giọng tiếng Việt.'});
$('#enBtn').onclick=()=>playAudio(enAudio,{bubbleText:'Bác đang test English voice.'});
async function play(k){scenarioAudio.src=aud[k];await playAudio(scenarioAudio,{stateName:k})}
document.querySelectorAll('[data-state]').forEach(x=>x.onclick=()=>play(x.dataset.state));

function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.round(r.width),Math.round(r.height),false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);
const clock=new THREE.Clock();let elapsed=0,frames=0;
function animate(){
  const dt=Math.min(.05,clock.getDelta());elapsed+=dt;const t=elapsed,u=b.userData,local=t-stateSince,enter=ease(local/.65);
  const breath=.5+.5*Math.sin(t*1.28);u.torso.scale.y=damp(u.torso.scale.y,1+.012*breath,4.2,dt);u.torso.position.y=damp(u.torso.position.y,.010*breath,4.2,dt);b.position.y=.010*Math.sin(t*.9);
  b.rotation.y=damp(b.rotation.y,0,5.0,dt);u.headRig.rotation.x=damp(u.headRig.rotation.x,.004*Math.sin(t*.55),5.0,dt);u.headRig.rotation.y=damp(u.headRig.rotation.y,.012*Math.sin(t*.40),5.0,dt);u.headRig.rotation.z=damp(u.headRig.rotation.z,.008*Math.sin(t*.62),5.0,dt);
  u.armL.rotation.x=damp(u.armL.rotation.x,0,5.2,dt);u.armR.rotation.x=damp(u.armR.rotation.x,0,5.2,dt);u.armL.rotation.z=damp(u.armL.rotation.z,-.05,5.2,dt);u.armR.rotation.z=damp(u.armR.rotation.z,.05,5.2,dt);
  u.browL.position.y=damp(u.browL.position.y,.46,6,dt);u.browR.position.y=damp(u.browR.position.y,.46,6,dt);u.browL.rotation.z=damp(u.browL.rotation.z,.05,6,dt);u.browR.rotation.z=damp(u.browR.rotation.z,-.05,6,dt);
  u.ears[0].rotation.z=damp(u.ears[0].rotation.z,.02,5,dt);u.ears[1].rotation.z=damp(u.ears[1].rotation.z,-.02,5,dt);

  if(t>u.nextBlink){u.blinkStart=t;u.nextBlink=t+2.8+Math.random()*3.4}
  const bp=t-u.blinkStart;let blink=0;if(bp>=0&&bp<.12)blink=ease(bp/.12);else if(bp<.26)blink=1-ease((bp-.12)/.14);
  const upperY=.165-.145*blink,lowerY=-.165+.115*blink;
  u.eyeL.upper.position.y=damp(u.eyeL.upper.position.y,upperY,24,dt);u.eyeR.upper.position.y=damp(u.eyeR.upper.position.y,upperY,24,dt);u.eyeL.lower.position.y=damp(u.eyeL.lower.position.y,lowerY,24,dt);u.eyeR.lower.position.y=damp(u.eyeR.lower.position.y,lowerY,24,dt);

  if(t>u.nextSaccade){u.saccadeX=(Math.random()-.5)*.018;u.saccadeY=(Math.random()-.5)*.011;u.nextSaccade=t+.8+Math.random()*1.6}u.saccadeX*=.965;u.saccadeY*=.965;
  let gx=u.saccadeX,gy=u.saccadeY;if(state==='thinking'){gx=.052+u.saccadeX;gy=.030+u.saccadeY}else if(state==='gentle'){gx=-.008+u.saccadeX;gy=-.016+u.saccadeY}else if(state==='welcoming'){gy=.006+u.saccadeY}
