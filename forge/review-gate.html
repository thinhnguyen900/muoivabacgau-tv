<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bác Gấu Phase 2 · WebGL Living Gate</title>
<style>
html,body{margin:0;background:#100e0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial;height:100%}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;box-sizing:border-box}.stage{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 45% 35%,#233447,#111821 60%,#0d0d0b);min-height:calc(100vh - 32px)}#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}.badge{position:absolute;left:20px;top:20px;padding:10px 14px;border-radius:999px;background:#120f0ccc;font-weight:800;z-index:3}.bubble{position:absolute;left:24px;right:24px;bottom:24px;background:#120f0cdd;border:1px solid #ffffff1c;border-radius:18px;padding:16px 18px;font-size:22px;z-index:3;backdrop-filter:blur(12px)}.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin-top:0}.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:10px 0}.ok{color:#8fd197}button{width:100%;padding:14px;border:0;border-radius:14px;background:#e0b568;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer}audio{width:100%;margin:8px 0 16px}#scenarioAudio{display:none}.state{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cdbfae;white-space:pre-wrap;max-height:220px;overflow:auto}.mini{font-size:12px;color:#aa9d8c;margin-top:6px}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{min-height:68vh}.side{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="badge">BODY ↔ BRAIN · WebGL living gate</div>
    <div class="bubble" id="bubble">Bác đang xếp sách. Bác chưa biết Muối đã về.</div>
  </section>
  <aside class="side">
    <h1>Bác Gấu Phase 2</h1>
    <div class="gate" id="visualStatus">3D: đang khởi tạo WebGL…</div>
    <div class="mini">Không dùng ảnh nền/Base64. Cảnh và nhân vật được dựng trực tiếp bằng 3D runtime.</div>
    <button id="viBtn">🔊 Test tiếng Việt</button>
    <audio id="viAudio" controls preload="auto" src="./assets/vi-test.mp3"></audio>
    <button id="enBtn">🔊 Test English</button>
    <audio id="enAudio" controls preload="auto" src="./assets/en-test.mp3"></audio>
    <audio id="scenarioAudio" preload="auto"></audio>
    <button data-state="welcoming">🏠 Muối về</button>
    <button data-state="gentle">😔 Con buồn</button>
    <button data-state="thinking">🤔 Hỏi khó</button>
    <button data-state="playful">🦖 Khủng long</button>
    <div class="state" id="stateDump">state=booting</div>
  </aside>
</div>
<script src="./brain.js"></script>
<script src="./liveness.js"></script>
<script type="module">
import * as THREE from './three.module.js';

const stage=document.getElementById('stage');
const bubble=document.getElementById('bubble');
const stateDump=document.getElementById('stateDump');
const visualStatus=document.getElementById('visualStatus');
const viAudio=document.getElementById('viAudio');
const enAudio=document.getElementById('enAudio');
const scenarioAudio=document.getElementById('scenarioAudio');
document.getElementById('viBtn').onclick=()=>{scenarioAudio.pause();viAudio.currentTime=0;viAudio.play()};
document.getElementById('enBtn').onclick=()=>{scenarioAudio.pause();enAudio.currentTime=0;enAudio.play()};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x182430);
scene.fog=new THREE.Fog(0x182430,11,27);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(0,3.45,9.4);camera.lookAt(0,2.0,0);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){visualStatus.textContent='✕ WebGL renderer failed';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffd8b1,0x203040,1.8));
const key=new THREE.DirectionalLight(0xffc58c,4.1);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);
const lamp=new THREE.PointLight(0xffa95e,14,8,2);lamp.position.set(3.7,3.2,1.5);scene.add(lamp);

function mat(color,rough=.82){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m}
function sphere(rx,ry,rz,color,rough=.9){const m=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),mat(color,rough));m.scale.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;return m}
function cyl(r1,r2,h,color){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,28),mat(color,.9));m.castShadow=true;return m}

box(15,.25,12,0x6b4735,0,-.12,0);box(15,7,.2,0x27313b,0,3,-4.9);box(.2,7,10,0x303844,-7.4,3,0);
const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.05,64),mat(0x6e2437,1));rug.scale.z=.66;rug.position.set(0,.05,.5);rug.receiveShadow=true;scene.add(rug);
box(2.7,3.7,.65,0x6a4027,-5.3,1.85,-4.25);
for(let r=0;r<4;r++){box(2.55,.08,.62,0x432918,-5.3,.55+r*.92,-3.9);for(let i=0;i<6;i++){const c=[0xa64c3d,0x4f7a78,0xd5a44f,0x7f5a8d,0x55745c,0x8d6d4b][i];box(.22+.05*(i%2),.55+.12*((i+r)%3),.32,c,-6.2+i*.38,.88+r*.92,-3.55)}}
box(1.65,3.65,.14,0x68472f,5.7,1.82,-4.73);box(.09,.09,.18,0xd6b15a,5.18,1.85,-4.58);
box(4,.72,1.45,0x344b52,2.2,.48,-1.9);box(4,1.25,.55,0x2c4148,2.2,1.25,-2.35);box(.48,1.15,1.45,0x2c4148,.35,.77,-1.9);box(.48,1.15,1.45,0x2c4148,4.05,.77,-1.9);
box(2.4,.16,1.25,0x7b5233,0,1.02,1.7);box(.16,1,.16,0x49301e,-.9,.5,1.35);box(.16,1,.16,0x49301e,.9,.5,1.35);
box(3,2.5,.12,0x111b24,-2.2,3.5,-4.74);box(.08,2.5,.16,0x8f6846,-2.2,3.5,-4.62);box(3,.08,.16,0x8f6846,-2.2,3.5,-4.62);
const moon=new THREE.Mesh(new THREE.SphereGeometry(.35,24,24),new THREE.MeshBasicMaterial({color:0xffe7a3}));moon.position.set(-2.9,4.1,-4.45);scene.add(moon);

function createBear(){
 const g=new THREE.Group();g.position.set(-1.25,0,0);
 const fur=0x68422f,furLight=0x82573d,muzzle=0xbd9270,dark=0x21140d,eye=0x120d09,white=0xf5e9d8;
 const torso=new THREE.Group();g.add(torso);
 const body=sphere(1.20,1.55,.90,fur);body.position.y=1.55;torso.add(body);
 const chest=sphere(.72,.92,.62,furLight);chest.position.set(0,1.63,.55);torso.add(chest);
 const neck=sphere(.72,.52,.62,fur);neck.position.set(0,2.65,.05);torso.add(neck);
 const headRig=new THREE.Group();headRig.position.set(0,3.28,.02);g.add(headRig);
 const head=sphere(1.08,1,.95,fur);headRig.add(head);
 const cheekL=sphere(.52,.50,.42,furLight);cheekL.position.set(-.42,-.20,.52);headRig.add(cheekL);const cheekR=cheekL.clone();cheekR.position.x=.42;headRig.add(cheekR);
 const earL=sphere(.42,.44,.24,fur);earL.position.set(-.72,.74,-.05);headRig.add(earL);const earR=earL.clone();earR.position.x=.72;headRig.add(earR);
 const earInL=sphere(.23,.25,.10,0xa97961);earInL.position.set(-.72,.75,.18);headRig.add(earInL);const earInR=earInL.clone();earInR.position.x=.72;headRig.add(earInR);
 const snout=sphere(.63,.45,.40,muzzle);snout.position.set(0,-.23,.76);headRig.add(snout);
 const jaw=sphere(.45,.20,.30,muzzle);jaw.position.set(0,-.48,.78);headRig.add(jaw);
 const nose=sphere(.22,.16,.13,dark,.5);nose.position.set(0,-.04,1.09);headRig.add(nose);
 const eyeL=new THREE.Mesh(new THREE.SphereGeometry(.12,24,18),mat(eye,.25));eyeL.position.set(-.36,.27,.91);headRig.add(eyeL);const eyeR=eyeL.clone();eyeR.position.x=.36;headRig.add(eyeR);
 const glintMat=new THREE.MeshBasicMaterial({color:white});const glintL=new THREE.Mesh(new THREE.SphereGeometry(.028,12,8),glintMat);glintL.position.set(-.33,.31,1.01);headRig.add(glintL);const glintR=glintL.clone();glintR.position.x=.39;headRig.add(glintR);
 const lidL=sphere(.17,.06,.08,furLight);lidL.position.set(-.36,.35,.985);headRig.add(lidL);const lidR=lidL.clone();lidR.position.x=.36;headRig.add(lidR);
 const browL=cyl(.035,.045,.36,dark);browL.position.set(-.38,.54,.91);browL.rotation.z=1.40;headRig.add(browL);const browR=browL.clone();browR.position.x=.38;browR.rotation.z=-1.40;headRig.add(browR);
 const shoulderL=sphere(.48,.42,.55,fur);shoulderL.position.set(-.88,2.17,0);torso.add(shoulderL);const shoulderR=shoulderL.clone();shoulderR.position.x=.88;torso.add(shoulderR);
 const armL=cyl(.24,.31,1.38,fur);armL.position.set(-1.12,1.65,.03);armL.rotation.z=-.2;torso.add(armL);const armR=armL.clone();armR.position.x=1.12;armR.rotation.z=.2;torso.add(armR);
 const pawL=sphere(.34,.27,.38,furLight);pawL.position.set(-1.26,1.02,.08);torso.add(pawL);const pawR=pawL.clone();pawR.position.x=1.26;torso.add(pawR);
 const legL=cyl(.36,.42,1,fur);legL.position.set(-.52,.45,0);torso.add(legL);const legR=legL.clone();legR.position.x=.52;torso.add(legR);
 const mouth=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,12,28,Math.PI),mat(dark,.4));mouth.position.set(0,-.42,1.10);mouth.rotation.z=Math.PI;headRig.add(mouth);
 const smileL=new THREE.Mesh(new THREE.TorusGeometry(.13,.024,10,20,Math.PI*.72),mat(dark,.4));smileL.position.set(-.13,-.42,1.09);smileL.rotation.z=2.70;headRig.add(smileL);const smileR=smileL.clone();smileR.position.x=.13;smileR.rotation.z=.44;headRig.add(smileR);
 g.userData={torso,body,chest,neck,headRig,head,armL,armR,pawL,pawR,mouth,jaw,eyeL,eyeR,glintL,glintR,lidL,lidR,browL,browR,blink:0,nextBlink:1.8,gazeX:0,gazeY:0};return g;
}
const bear=createBear();scene.add(bear);
function createRabbit(){const g=new THREE.Group();g.visible=false;g.position.set(5.1,0,-2.9);const fur=0x8d9498,white=0xe5ded2;const body=sphere(.5,.75,.45,fur);body.position.y=.8;g.add(body);const head=sphere(.48,.5,.43,fur);head.position.y=1.7;g.add(head);const e1=sphere(.17,.58,.12,fur);e1.position.set(-.2,2.42,0);e1.rotation.z=-.08;g.add(e1);const e2=e1.clone();e2.position.x=.2;e2.rotation.z=.08;g.add(e2);const sn=sphere(.28,.2,.18,white);sn.position.set(0,1.58,.38);g.add(sn);return g}
const rabbit=createRabbit();scene.add(rabbit);

const stateText={welcoming:'Ủa! Muối về rồi à? Bác mừng con về.',gentle:'Ừ, bác nghe đây. Con kể từ từ cũng được.',thinking:'Hừm… câu này hay đó. Bác nghĩ một chút nha.',playful:'Ồ, khủng long hả? Bác tò mò rồi đó!'};
const stateAudio={welcoming:'./assets/scenario-welcoming.mp3',gentle:'./assets/scenario-gentle.mp3',thinking:'./assets/scenario-thinking.mp3',playful:'./assets/scenario-playful.mp3'};
let state='listening',stateAt=performance.now(),speaking=false,plan=BacGauLiveness.plan({performance:'listening',turn:0,text:'boot',speaking:false});
function refreshPlan(){plan=BacGauLiveness.plan({performance:state,turn:Math.floor(performance.now()),text:stateText[state]||'listening',speaking});stateDump.textContent=JSON.stringify(plan,null,2);window.__BACGAU_SPEAKING__=speaking;}
function applyState(k){state=k;stateAt=performance.now();bubble.textContent=stateText[k];stage.dataset.state=k;rabbit.visible=k==='playful';refreshPlan();}
async function playScenario(k){
 viAudio.pause();enAudio.pause();scenarioAudio.pause();scenarioAudio.src=stateAudio[k];scenarioAudio.currentTime=0;speaking=true;applyState(k);
 try{await scenarioAudio.play();window.__BACGAU_SCENARIO_AUDIO__={state:k,src:scenarioAudio.currentSrc||scenarioAudio.src,played:true};}
 catch(e){speaking=false;refreshPlan();window.__BACGAU_SCENARIO_AUDIO__={state:k,error:String(e)};throw e;}
}
scenarioAudio.addEventListener('playing',()=>{speaking=true;refreshPlan()});
scenarioAudio.addEventListener('ended',()=>{speaking=false;refreshPlan()});
scenarioAudio.addEventListener('pause',()=>{if(scenarioAudio.ended||scenarioAudio.currentTime===0){speaking=false;refreshPlan()}});
document.querySelectorAll('[data-state]').forEach(btn=>btn.onclick=()=>playScenario(btn.dataset.state));

function resize(){const r=stage.getBoundingClientRect();const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);
const clock=new THREE.Clock();let frames=0;
function animate(){
 const t=clock.getElapsedTime(),u=bear.userData;
 const breath=.5+.5*Math.sin(t*1.65);
 u.torso.scale.y=1+.012*breath;u.torso.position.y=.012*breath;bear.position.y=.018*Math.sin(t*1.4);u.headRig.rotation.z=.014*Math.sin(t*.85);u.headRig.rotation.y=.018*Math.sin(t*.55);
 u.armL.rotation.z=-.2+.018*Math.sin(t*1.15);u.armR.rotation.z=.2-.018*Math.sin(t*1.05);
 if(t>u.nextBlink){u.blink=1;u.nextBlink=t+2.5+Math.random()*3.4}u.blink=Math.max(0,u.blink-.12);const lidScale=.16+.84*Math.sin(Math.PI*u.blink);u.lidL.scale.y=lidScale;u.lidR.scale.y=lidScale;u.eyeL.scale.y=1-.72*Math.sin(Math.PI*u.blink);u.eyeR.scale.y=1-.72*Math.sin(Math.PI*u.blink);
 const targetGX=state==='thinking'?.045:state==='playful'?.035*Math.sin(t*2):state==='gentle'?-0.018:0;const targetGY=state==='thinking'?.025:state==='gentle'?-.018:0;u.gazeX+=(targetGX-u.gazeX)*.06;u.gazeY+=(targetGY-u.gazeY)*.06;u.eyeL.position.x=-.36+u.gazeX;u.eyeR.position.x=.36+u.gazeX;u.eyeL.position.y=.27+u.gazeY;u.eyeR.position.y=.27+u.gazeY;u.glintL.position.x=-.33+u.gazeX;u.glintR.position.x=.39+u.gazeX;u.glintL.position.y=.31+u.gazeY;u.glintR.position.y=.31+u.gazeY;
 const talk=speaking?(.48+.42*Math.abs(Math.sin(t*12.7))+ .10*Math.abs(Math.sin(t*27.1))):0;u.mouth.scale.y=.94-.34*talk;u.jaw.position.y=-.48-.065*talk;
 u.browL.rotation.z=1.40;u.browR.rotation.z=-1.40;u.browL.position.y=.54;u.browR.position.y=.54;
 if(state==='welcoming'){bear.rotation.y=.08+.035*Math.sin(t*2.1);u.headRig.rotation.y=.15+.025*Math.sin(t*2.8);u.headRig.rotation.x=-.02;u.armL.rotation.z=-.53+.11*Math.sin(t*3.2);u.armR.rotation.z=.33-.05*Math.sin(t*2.6);u.browL.position.y=.58;u.browR.position.y=.58;}
 if(state==='gentle'){bear.rotation.y=.07;u.headRig.rotation.x=-.10;u.headRig.rotation.z=.055;u.armR.rotation.z=.31;u.armL.rotation.z=-.16;u.browL.rotation.z=1.30;u.browR.rotation.z=-1.30;u.browL.position.y=.50;u.browR.position.y=.50;}
 if(state==='thinking'){bear.rotation.y=.02;u.headRig.rotation.z=.075+.025*Math.sin(t*1.4);u.headRig.rotation.x=-.035;u.armR.rotation.z=.61;u.armR.rotation.x=-.30;u.browL.rotation.z=1.10;u.browR.rotation.z=-1.56;u.browL.position.y=.57;u.browR.position.y=.52;}
 if(state==='playful'){bear.rotation.y=.10*Math.sin(t*2.0);u.headRig.rotation.y=.07*Math.sin(t*3.4);u.headRig.rotation.x=-.035+.025*Math.sin(t*3);u.armL.rotation.z=-.42+.15*Math.sin(t*3);u.armR.rotation.z=.43-.13*Math.sin(t*2.6);u.browL.position.y=.59;u.browR.position.y=.59;rabbit.position.y=.02*Math.sin(t*3.2);}
 if(state==='listening'){bear.rotation.y*=.92;u.headRig.rotation.x*=.92;u.headRig.rotation.y*=.94;u.headRig.rotation.z*=.96;u.armR.rotation.x*=.9;}
 renderer.render(scene,camera);frames++;if(frames===2){window.__BACGAU_READY__=true;window.__BACGAU_BODY_V2__={facialRig:true,blink:true,gaze:true,breathing:true,brows:true,jaw:true,audioDrivenMouth:true};visualStatus.innerHTML='<span class="ok">✓ WebGL 3D runtime rendered · facial rig v2 · scenario speech wired</span>';stateDump.textContent=JSON.stringify(plan,null,2)}requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
