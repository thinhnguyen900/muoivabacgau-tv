<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bác Gấu Phase 2 · WebGL Living Gate</title>
<style>
html,body{margin:0;background:#100e0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial;height:100%}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;box-sizing:border-box}.stage{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 45% 35%,#342a25,#161512 62%,#0d0d0b);min-height:calc(100vh - 32px)}#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}.badge{position:absolute;left:20px;top:20px;padding:10px 14px;border-radius:999px;background:#120f0ccc;font-weight:800;z-index:3}.bubble{position:absolute;left:24px;right:24px;bottom:24px;background:#120f0cdd;border:1px solid #ffffff1c;border-radius:18px;padding:16px 18px;font-size:22px;z-index:3;backdrop-filter:blur(12px)}.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin-top:0}.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:10px 0}.ok{color:#8fd197}button{width:100%;padding:14px;border:0;border-radius:14px;background:#e0b568;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer}audio{width:100%;margin:8px 0 16px}#scenarioAudio{display:none}.state{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cdbfae;white-space:pre-wrap;max-height:220px;overflow:auto}.mini{font-size:12px;color:#aa9d8c;margin-top:6px}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{min-height:68vh}.side{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="badge">BODY ↔ BRAIN · WebGL living gate</div>
    <div class="bubble" id="bubble">Bác đang xếp sách. Bác chưa biết Muối đã về.</div>
  </section>
  <aside class="side">
    <h1>Bác Gấu Phase 2</h1>
    <div class="gate" id="visualStatus">3D: đang khởi tạo WebGL…</div>
    <div class="mini">Không dùng ảnh nền/Base64. Cảnh và nhân vật được dựng trực tiếp bằng 3D runtime.</div>
    <button id="viBtn">🔊 Test tiếng Việt</button>
    <audio id="viAudio" controls preload="auto" src="./assets/vi-test.mp3"></audio>
    <button id="enBtn">🔊 Test English</button>
    <audio id="enAudio" controls preload="auto" src="./assets/en-test.mp3"></audio>
    <audio id="scenarioAudio" preload="auto"></audio>
    <button data-state="welcoming">🏠 Muối về</button>
    <button data-state="gentle">😔 Con buồn</button>
    <button data-state="thinking">🤔 Hỏi khó</button>
    <button data-state="playful">🦖 Khủng long</button>
    <div class="state" id="stateDump">state=booting</div>
  </aside>
</div>
<script src="./brain.js"></script>
<script src="./liveness.js"></script>
<script type="module">
import * as THREE from './three.module.js';

const stage=document.getElementById('stage');
const bubble=document.getElementById('bubble');
const stateDump=document.getElementById('stateDump');
const visualStatus=document.getElementById('visualStatus');
const viAudio=document.getElementById('viAudio');
const enAudio=document.getElementById('enAudio');
const scenarioAudio=document.getElementById('scenarioAudio');
document.getElementById('viBtn').onclick=()=>{scenarioAudio.pause();viAudio.currentTime=0;viAudio.play()};
document.getElementById('enBtn').onclick=()=>{scenarioAudio.pause();enAudio.currentTime=0;enAudio.play()};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x221d19);
scene.fog=new THREE.Fog(0x221d19,12,28);
const camera=new THREE.PerspectiveCamera(40,1,.1,100);
camera.position.set(0,3.4,9.6);camera.lookAt(-.45,2.05,0);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){visualStatus.textContent='✕ WebGL renderer failed';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.98;stage.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe5ca,0x30333b,1.26));
const key=new THREE.DirectionalLight(0xffd4aa,2.22);key.position.set(-4.6,7.2,5.8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const fill=new THREE.PointLight(0xffbd83,4.15,9,2);fill.position.set(3.8,3.6,2.1);scene.add(fill);
const rim=new THREE.DirectionalLight(0x9db2bd,.72);rim.position.set(4,5,-3);scene.add(rim);

function mat(color,rough=.9){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:0})}
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m}
function sphere(rx,ry,rz,color,rough=.92){const m=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),mat(color,rough));m.scale.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;return m}
function cyl(r1,r2,h,color){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,32),mat(color,.94));m.castShadow=true;return m}

box(15,.25,12,0x644533,0,-.12,0);box(15,7,.2,0x3a332f,0,3,-4.9);box(.2,7,10,0x423b35,-7.4,3,0);
const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.05,64),mat(0x703540,1));rug.scale.z=.66;rug.position.set(0,.05,.5);rug.receiveShadow=true;scene.add(rug);
box(2.7,3.7,.65,0x674126,-5.3,1.85,-4.25);
for(let r=0;r<4;r++){box(2.55,.08,.62,0x432918,-5.3,.55+r*.92,-3.9);for(let i=0;i<6;i++){const c=[0xa64c3d,0x4f7a78,0xd5a44f,0x7f5a8d,0x55745c,0x8d6d4b][i];box(.22+.05*(i%2),.55+.12*((i+r)%3),.32,c,-6.2+i*.38,.88+r*.92,-3.55)}}
box(1.65,3.65,.14,0x68472f,5.7,1.82,-4.73);box(.09,.09,.18,0xd6b15a,5.18,1.85,-4.58);
box(4,.72,1.45,0x405057,2.2,.48,-1.9);box(4,1.25,.55,0x35464c,2.2,1.25,-2.35);box(.48,1.15,1.45,0x35464c,.35,.77,-1.9);box(.48,1.15,1.45,0x35464c,4.05,.77,-1.9);
box(2.4,.16,1.25,0x7b5233,0,1.02,1.7);box(.16,1,.16,0x49301e,-.9,.5,1.35);box(.16,1,.16,0x49301e,.9,.5,1.35);
box(3,2.5,.12,0x18202a,-2.2,3.5,-4.74);box(.08,2.5,.16,0x8f6846,-2.2,3.5,-4.62);box(3,.08,.16,0x8f6846,-2.2,3.5,-4.62);
const moon=new THREE.Mesh(new THREE.SphereGeometry(.35,24,24),new THREE.MeshBasicMaterial({color:0xffe3a0}));moon.position.set(-2.9,4.1,-4.45);scene.add(moon);

function createBear(){
 const g=new THREE.Group();g.position.set(-1.05,0,.12);
 const fur=0x704a37,furMid=0x815842,furLight=0x986b50,muzzle=0xbf9878,muzzleShadow=0xa67f64,dark=0x362319,browColor=0x4a3024,sclera=0xeadcca,iris=0x725038,pupil=0x17100c;
 const torso=new THREE.Group();g.add(torso);
 const body=sphere(1.18,1.52,.88,fur,.96);body.position.y=1.52;torso.add(body);
 const belly=sphere(.72,.91,.57,furMid,.98);belly.position.set(0,1.53,.55);torso.add(belly);
 const chest=sphere(.62,.63,.50,furLight,.98);chest.position.set(0,2.12,.49);chest.scale.y=.78;torso.add(chest);
 const neck=sphere(.73,.50,.61,fur,.97);neck.position.set(0,2.64,.02);torso.add(neck);
 const headRig=new THREE.Group();headRig.position.set(0,3.29,.02);g.add(headRig);
 const head=sphere(1.10,1.04,.91,fur,.95);head.scale.x=1.025;headRig.add(head);
 const templeL=sphere(.47,.55,.34,furMid,.97);templeL.position.set(-.48,.03,.41);headRig.add(templeL);const templeR=templeL.clone();templeR.position.x=.48;headRig.add(templeR);
 const cheekL=sphere(.43,.40,.33,furLight,.98);cheekL.position.set(-.38,-.23,.49);headRig.add(cheekL);const cheekR=cheekL.clone();cheekR.position.x=.38;headRig.add(cheekR);
 const earL=sphere(.33,.35,.21,fur,.96);earL.position.set(-.73,.74,-.04);earL.rotation.z=-.12;headRig.add(earL);const earR=earL.clone();earR.position.x=.73;earR.rotation.z=.12;headRig.add(earR);
 const earInL=sphere(.18,.20,.085,0xa77865,.92);earInL.position.set(-.73,.74,.15);headRig.add(earInL);const earInR=earInL.clone();earInR.position.x=.73;headRig.add(earInR);
 const muzzlePadL=sphere(.35,.265,.255,muzzle,.94);muzzlePadL.position.set(-.19,-.255,.685);headRig.add(muzzlePadL);const muzzlePadR=muzzlePadL.clone();muzzlePadR.position.x=.19;headRig.add(muzzlePadR);
 const lowerMuzzle=sphere(.345,.205,.245,muzzleShadow,.95);lowerMuzzle.position.set(0,-.425,.655);headRig.add(lowerMuzzle);
 const jaw=sphere(.305,.145,.215,muzzle,.95);jaw.position.set(0,-.485,.68);headRig.add(jaw);
 const nose=sphere(.168,.112,.105,dark,.58);nose.position.set(0,-.095,.915);nose.rotation.x=.06;headRig.add(nose);
 const bridge=sphere(.25,.18,.145,furMid,.96);bridge.position.set(0,.015,.625);bridge.scale.y=.76;headRig.add(bridge);

 function eyeAssembly(x){
   const scl=new THREE.Group();scl.position.set(x,.295,.795);headRig.add(scl);
   const white=sphere(.158,.112,.060,sclera,.52);white.castShadow=false;scl.add(white);
   const look=new THREE.Group();look.position.set(0,0,.056);scl.add(look);
   const ir=sphere(.108,.101,.034,iris,.44);ir.castShadow=false;look.add(ir);
   const pu=sphere(.052,.058,.020,pupil,.32);pu.position.z=.029;pu.castShadow=false;look.add(pu);
   const gl=new THREE.Mesh(new THREE.SphereGeometry(.020,12,8),new THREE.MeshBasicMaterial({color:0xfffbef}));gl.position.set(-.026,.030,.053);look.add(gl);
   const upper=sphere(.188,.060,.074,furMid,.97);upper.position.set(x,.395,.835);headRig.add(upper);
   const lower=sphere(.174,.038,.066,furLight,.98);lower.position.set(x,.192,.826);headRig.add(lower);
   return {scl,look,white,upper,lower,gl};
 }
 const eL=eyeAssembly(-.33),eR=eyeAssembly(.33);
 const browL=sphere(.205,.038,.037,browColor,.84);browL.position.set(-.35,.535,.825);browL.rotation.z=.09;headRig.add(browL);
 const browR=browL.clone();browR.position.x=.35;browR.rotation.z=-.09;headRig.add(browR);
 const mouth=new THREE.Mesh(new THREE.TorusGeometry(.155,.021,12,30,Math.PI),mat(dark,.58));mouth.position.set(0,-.438,.905);mouth.rotation.z=Math.PI;headRig.add(mouth);
 const mouthCornerL=sphere(.025,.017,.016,dark,.58);mouthCornerL.position.set(-.155,-.43,.902);headRig.add(mouthCornerL);const mouthCornerR=mouthCornerL.clone();mouthCornerR.position.x=.155;headRig.add(mouthCornerR);

 const shoulderL=sphere(.50,.45,.53,fur,.96);shoulderL.position.set(-.88,2.14,.0);torso.add(shoulderL);const shoulderR=shoulderL.clone();shoulderR.position.x=.88;torso.add(shoulderR);
 function arm(side){const rig=new THREE.Group();rig.position.set(side*.93,2.02,.03);torso.add(rig);const upper=sphere(.32,.62,.33,fur,.96);upper.position.set(side*.10,-.43,.02);upper.rotation.z=side*-.10;rig.add(upper);const fore=sphere(.285,.55,.30,furMid,.97);fore.position.set(side*.19,-1.00,.11);fore.rotation.z=side*-.14;rig.add(fore);const paw=sphere(.36,.30,.37,furLight,.98);paw.position.set(side*.24,-1.43,.18);paw.rotation.z=side*-.10;rig.add(paw);return {rig,paw}}
 const aL=arm(-1),aR=arm(1);
 const haunchL=sphere(.50,.55,.50,fur,.97);haunchL.position.set(-.54,.66,-.05);torso.add(haunchL);const haunchR=haunchL.clone();haunchR.position.x=.54;torso.add(haunchR);
 const footL=sphere(.43,.27,.54,furMid,.98);footL.position.set(-.55,.22,.21);torso.add(footL);const footR=footL.clone();footR.position.x=.55;torso.add(footR);
 g.userData={torso,body,belly,chest,neck,headRig,head,armL:aL.rig,armR:aR.rig,pawL:aL.paw,pawR:aR.paw,mouth,jaw,eyeL:eL.look,eyeR:eR.look,scleraL:eL.scl,scleraR:eR.scl,upperLidL:eL.upper,upperLidR:eR.upper,lowerLidL:eL.lower,lowerLidR:eR.lower,browL,browR,mouthCornerL,mouthCornerR,blink:0,nextBlink:1.8,gazeX:0,gazeY:0,visualVersion:'v5-warm-soft'};return g;
}
const bear=createBear();scene.add(bear);
function createRabbit(){const g=new THREE.Group();g.visible=false;g.position.set(5.1,0,-2.9);const fur=0x8d9498,white=0xe5ded2;const body=sphere(.5,.75,.45,fur);body.position.y=.8;g.add(body);const head=sphere(.48,.5,.43,fur);head.position.y=1.7;g.add(head);const e1=sphere(.17,.58,.12,fur);e1.position.set(-.2,2.42,0);e1.rotation.z=-.08;g.add(e1);const e2=e1.clone();e2.position.x=.2;e2.rotation.z=.08;g.add(e2);const sn=sphere(.28,.2,.18,white);sn.position.set(0,1.58,.38);g.add(sn);return g}
const rabbit=createRabbit();scene.add(rabbit);

const stateText={welcoming:'Ủa! Muối về rồi à? Bác mừng con về.',gentle:'Ừ, bác nghe đây. Con kể từ từ cũng được.',thinking:'Hừm… câu này hay đó. Bác nghĩ một chút nha.',playful:'Ồ, khủng long hả? Bác tò mò rồi đó!'};
const stateAudio={welcoming:'./assets/scenario-welcoming.mp3',gentle:'./assets/scenario-gentle.mp3',thinking:'./assets/scenario-thinking.mp3',playful:'./assets/scenario-playful.mp3'};
let state='listening',stateAt=performance.now(),speaking=false,plan=BacGauLiveness.plan({performance:'listening',turn:0,text:'boot',speaking:false});
function refreshPlan(){plan=BacGauLiveness.plan({performance:state,turn:Math.floor(performance.now()),text:stateText[state]||'listening',speaking});stateDump.textContent=JSON.stringify(plan,null,2);window.__BACGAU_SPEAKING__=speaking;}
function applyState(k){state=k;stateAt=performance.now();bubble.textContent=stateText[k];stage.dataset.state=k;rabbit.visible=k==='playful';refreshPlan();}
async function playScenario(k){
 viAudio.pause();enAudio.pause();scenarioAudio.pause();scenarioAudio.src=stateAudio[k];scenarioAudio.currentTime=0;speaking=true;applyState(k);
 try{await scenarioAudio.play();window.__BACGAU_SCENARIO_AUDIO__={state:k,src:scenarioAudio.currentSrc||scenarioAudio.src,played:true};}
 catch(e){speaking=false;refreshPlan();window.__BACGAU_SCENARIO_AUDIO__={state:k,error:String(e)};throw e;}
}
scenarioAudio.addEventListener('playing',()=>{speaking=true;refreshPlan()});
scenarioAudio.addEventListener('ended',()=>{speaking=false;refreshPlan()});
scenarioAudio.addEventListener('pause',()=>{if(scenarioAudio.ended||scenarioAudio.currentTime===0){speaking=false;refreshPlan()}});
document.querySelectorAll('[data-state]').forEach(btn=>btn.onclick=()=>playScenario(btn.dataset.state));

function resize(){const r=stage.getBoundingClientRect();const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);
const clock=new THREE.Clock();let frames=0;
function animate(){
 const t=clock.getElapsedTime(),u=bear.userData;
 const breath=.5+.5*Math.sin(t*1.55);
 u.torso.scale.y=1+.010*breath;u.torso.position.y=.010*breath;bear.position.y=.014*Math.sin(t*1.25);u.headRig.rotation.z=.010*Math.sin(t*.80);u.headRig.rotation.y=.014*Math.sin(t*.52);
 u.armL.rotation.z=-.06+.014*Math.sin(t*.95);u.armR.rotation.z=.06-.014*Math.sin(t*.91);
 if(t>u.nextBlink){u.blink=1;u.nextBlink=t+2.8+Math.random()*3.7}u.blink=Math.max(0,u.blink-.105);const close=Math.sin(Math.PI*u.blink);u.upperLidL.position.y=.395-.118*close;u.upperLidR.position.y=.395-.112*Math.max(0,Math.min(1,close*.94));u.lowerLidL.position.y=.192+.045*close;u.lowerLidR.position.y=.192+.043*Math.max(0,Math.min(1,close*.94));
 const targetGX=state==='thinking'?.026:state==='playful'?.018*Math.sin(t*1.8):state==='gentle'?-0.009:0;const targetGY=state==='thinking'?.016:state==='gentle'?-.009:0;u.gazeX+=(targetGX-u.gazeX)*.055;u.gazeY+=(targetGY-u.gazeY)*.055;u.eyeL.position.x=u.gazeX;u.eyeR.position.x=u.gazeX;u.eyeL.position.y=u.gazeY;u.eyeR.position.y=u.gazeY;
 const talk=speaking?(.42+.40*Math.abs(Math.sin(t*12.1))+.12*Math.abs(Math.sin(t*23.7))):0;u.mouth.scale.y=.96-.28*talk;u.jaw.position.y=-.485-.050*talk;u.jaw.scale.y=1+.10*talk;
 u.browL.rotation.z=.09;u.browR.rotation.z=-.09;u.browL.position.y=.535;u.browR.position.y=.535;u.browL.position.x=-.35;u.browR.position.x=.35;
 if(state==='welcoming'){bear.rotation.y=.055+.025*Math.sin(t*1.9);u.headRig.rotation.y=.105+.020*Math.sin(t*2.4);u.headRig.rotation.x=-.018;u.armL.rotation.z=-.30+.08*Math.sin(t*2.8);u.armR.rotation.z=.16-.04*Math.sin(t*2.4);u.browL.position.y=.575;u.browR.position.y=.575;}
 if(state==='gentle'){bear.rotation.y=.045;u.headRig.rotation.x=-.075;u.headRig.rotation.z=.040;u.armR.rotation.z=.14;u.armL.rotation.z=-.08;u.browL.rotation.z=.17;u.browR.rotation.z=-.17;u.browL.position.y=.545;u.browR.position.y=.545;u.browL.position.x=-.34;u.browR.position.x=.34;}
 if(state==='thinking'){bear.rotation.y=.015;u.headRig.rotation.z=.060+.020*Math.sin(t*1.25);u.headRig.rotation.x=-.028;u.armR.rotation.z=.34;u.armR.rotation.x=-.16;u.browL.rotation.z=.21;u.browR.rotation.z=-.045;u.browL.position.y=.565;u.browR.position.y=.528;}
 if(state==='playful'){bear.rotation.y=.065*Math.sin(t*1.8);u.headRig.rotation.y=.045*Math.sin(t*3.0);u.headRig.rotation.x=-.025+.018*Math.sin(t*2.7);u.armL.rotation.z=-.24+.10*Math.sin(t*2.8);u.armR.rotation.z=.25-.09*Math.sin(t*2.4);u.browL.position.y=.585;u.browR.position.y=.565;u.browL.rotation.z=.025;u.browR.rotation.z=-.15;rabbit.position.y=.02*Math.sin(t*3.2);}
 if(state==='listening'){bear.rotation.y*=.92;u.headRig.rotation.x*=.92;u.headRig.rotation.y*=.94;u.headRig.rotation.z*=.96;u.armR.rotation.x*=.9;}
 renderer.render(scene,camera);frames++;if(frames===2){window.__BACGAU_READY__=true;window.__BACGAU_BODY_V2__={facialRig:true,blink:true,gaze:true,breathing:true,brows:true,jaw:true,audioDrivenMouth:true,visualVersion:'v5-warm-soft',scleraIrisPupil:true,softArmRig:true,cinematicToneMap:true,eyeWhiteReduced:true,muzzleIntegrated:true,softBrow:true};visualStatus.innerHTML='<span class="ok">✓ WebGL 3D runtime rendered · warm character v5 · softer face · scenario speech</span>';stateDump.textContent=JSON.stringify(plan,null,2)}requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
