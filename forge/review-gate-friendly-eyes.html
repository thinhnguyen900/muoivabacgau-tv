<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bác Gấu Phase 2 · Friendly Eyes Pass</title>
<style>
html,body{margin:0;height:100%;background:#15100c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial}.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;box-sizing:border-box}.stage{position:relative;overflow:hidden;border-radius:24px;background:#211913}.stage canvas{width:100%!important;height:100%!important;display:block}.badge,.note{position:absolute;z-index:2;background:#120f0ccc;border:1px solid #ffffff18;backdrop-filter:blur(10px)}.badge{left:20px;top:20px;padding:10px 14px;border-radius:999px;font-weight:800}.note{left:24px;right:24px;bottom:24px;padding:14px 16px;border-radius:16px;font-size:18px}.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin:0 0 10px}.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:12px 0}.ok{color:#8fd197}.metric{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#cdbfae;white-space:pre-wrap}@media(max-width:900px){.app{height:auto;min-height:100%;grid-template-columns:1fr}.stage{min-height:68vh}.side{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
<section class="stage" id="stage"><div class="badge">FRIENDLY EYE CONTACT · v1</div><div class="note">Mục tiêu pass này: mắt nhìn ấm và có điểm tập trung, không trợn/cross-eyed khi chuyển trạng thái.</div></section>
<aside class="side"><h1>Bác Gấu Phase 2</h1><div class="gate" id="status">3D: đang khởi tạo…</div><div class="metric" id="metrics">eyeSpacing=0.72\nsclera=0.155x0.19\nirisRatio=0.64\ngazeClamp=±0.018</div></aside>
</div>
<script type="module">
import * as THREE from './three.module.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x211913);scene.fog=new THREE.Fog(0x211913,12,28);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,3.3,10.2);camera.lookAt(-.4,2.15,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe7cb,0x2d241d,2.2));const key=new THREE.DirectionalLight(0xffd1a6,3.0);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.PointLight(0xffb978,7,9,2);fill.position.set(3.6,3.8,2.4);scene.add(fill);
function mat(color,rough=.78){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:0})}function sphere(x,y,z,color,rough=.82,seg=40){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(20,seg/2)),mat(color,rough));m.scale.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m}
const floor=new THREE.Mesh(new THREE.BoxGeometry(15,.25,12),mat(0x5a3b2a,.95));floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);
function createBear(){const g=new THREE.Group();g.position.set(-.9,0,.1);const fur=0x85502f,fur2=0x9a6037,muzzle=0xd39b68,dark=0x2a170d,sclera=0xf0dfc8,iris=0x704322,pupil=0x140c08,pink=0xc98164;const torso=new THREE.Group();g.add(torso);const body=sphere(1.1,1.42,.88,fur);body.position.y=1.47;torso.add(body);const chest=sphere(.66,.84,.55,fur2);chest.position.set(0,1.52,.58);torso.add(chest);const headRig=new THREE.Group();headRig.position.set(0,3.2,.06);g.add(headRig);const head=sphere(1.02,.94,.9,fur);headRig.add(head);const cheekL=sphere(.38,.34,.33,fur2);cheekL.position.set(-.4,-.18,.55);headRig.add(cheekL);const cheekR=cheekL.clone();cheekR.position.x=.4;headRig.add(cheekR);const earL=sphere(.35,.36,.21,fur);earL.position.set(-.69,.69,-.03);headRig.add(earL);const earR=earL.clone();earR.position.x=.69;headRig.add(earR);const earInL=sphere(.19,.20,.075,pink);earInL.position.set(-.69,.69,.16);headRig.add(earInL);const earInR=earInL.clone();earInR.position.x=.69;headRig.add(earInR);const snout=sphere(.54,.36,.35,muzzle);snout.position.set(0,-.21,.78);headRig.add(snout);const jaw=sphere(.39,.15,.26,muzzle);jaw.position.set(0,-.46,.8);headRig.add(jaw);const nose=sphere(.18,.13,.11,dark,.45);nose.position.set(0,-.03,1.06);headRig.add(nose);
 function eye(x){const rig=new THREE.Group();rig.position.set(x,.24,.82);const white=sphere(.155,.19,.075,sclera,.52,32);rig.add(white);const irisM=sphere(.100,.118,.045,iris,.34,28);irisM.position.set(0,-.006,.066);rig.add(irisM);const pup=sphere(.056,.069,.028,pupil,.25,24);pup.position.set(0,-.006,.101);rig.add(pup);const gl=new THREE.Mesh(new THREE.SphereGeometry(.018,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));gl.position.set(-.026,.035,.126);rig.add(gl);const upper=sphere(.17,.065,.06,fur2,.75,28);upper.position.set(0,.145,.045);rig.add(upper);headRig.add(rig);return{rig,irisM,pup,gl,upper}}
 const eL=eye(-.36),eR=eye(.36);const browMat=mat(0x4a2716,.75);function brow(x,flip){const b=new THREE.Mesh(new THREE.CapsuleGeometry(.035,.20,5,9),browMat);b.position.set(x,.53,.91);b.rotation.z=flip*.72;headRig.add(b);return b}const browL=brow(-.36,1),browR=brow(.36,-1);const mouth=new THREE.Mesh(new THREE.TorusGeometry(.17,.022,10,28,Math.PI),mat(dark,.5));mouth.position.set(0,-.40,1.075);mouth.rotation.z=Math.PI;headRig.add(mouth);const armL=sphere(.32,.76,.36,fur);armL.position.set(-.98,1.5,.08);armL.rotation.z=-.12;torso.add(armL);const armR=armL.clone();armR.position.x=.98;armR.rotation.z=.12;torso.add(armR);const footL=sphere(.43,.29,.54,fur);footL.position.set(-.47,.34,.12);torso.add(footL);const footR=footL.clone();footR.position.x=.47;torso.add(footR);g.userData={torso,headRig,eL,eR,browL,browR,nextBlink:2,blink:0,gazeX:0,gazeY:0};return g}
const bear=createBear();scene.add(bear);
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
const clock=new THREE.Clock();let frames=0;function animate(){const t=clock.getElapsedTime(),u=bear.userData,breath=.5+.5*Math.sin(t*1.45);u.torso.scale.y=1+.008*breath;bear.position.y=.01*Math.sin(t*1.15);u.headRig.rotation.z=.006*Math.sin(t*.7);u.headRig.rotation.y=.012*Math.sin(t*.5);if(t>u.nextBlink){u.blink=1;u.nextBlink=t+3.2+Math.random()*3.8}u.blink=Math.max(0,u.blink-.12);const blink=Math.sin(Math.PI*u.blink),eyeScale=1-.78*blink;u.eL.rig.scale.y=eyeScale;u.eR.rig.scale.y=eyeScale;const tx=Math.max(-.018,Math.min(.018,.010*Math.sin(t*.42))),ty=Math.max(-.012,Math.min(.012,.006*Math.sin(t*.31)));u.gazeX+=(tx-u.gazeX)*.035;u.gazeY+=(ty-u.gazeY)*.035;[u.eL,u.eR].forEach(e=>{e.irisM.position.x=u.gazeX;e.pup.position.x=u.gazeX;e.gl.position.x=-.026+u.gazeX;e.irisM.position.y=-.006+u.gazeY;e.pup.position.y=-.006+u.gazeY;e.gl.position.y=.035+u.gazeY});renderer.render(scene,camera);frames++;if(frames===2){status.innerHTML='<span class="ok">✓ Friendly-eye pass rendered · coupled gaze · constrained sclera</span>';window.__BACGAU_READY__=true;window.__BACGAU_EYE_CONTRACT__={eyeSpacing:.72,scleraX:.155,scleraY:.19,irisRatio:.64,gazeClampX:.018,gazeClampY:.012,coupledGaze:true}}requestAnimationFrame(animate)}animate();
</script>
</body>
</html>
