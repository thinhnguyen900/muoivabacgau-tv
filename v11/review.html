<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bác Gấu V11 — Interim Mature Preview</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    .review-note{position:fixed;z-index:50;left:12px;top:12px;max-width:min(520px,calc(100vw - 24px));padding:9px 12px;border-radius:12px;background:rgba(25,20,17,.88);color:#fff6e7;font:600 12px/1.35 system-ui,-apple-system,sans-serif;backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
    .review-note b{color:#ffd98e}.review-note span{opacity:.78;font-weight:500}
    @media(max-width:900px){.review-note{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;max-width:none}.pill{top:90px!important}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="review-note"><b>INTERIM V11 MATURE PREVIEW · SAFARI FIX</b><br><span>Review tỷ lệ mặt, mắt, mõm, ánh sáng và motion. Đây chưa phải mesh GLB miễn phí cuối cùng.</span></div>
  <div id="app"></div>
  <script type="module" src="./src/review-main.js"></script>
</body>
</html>
