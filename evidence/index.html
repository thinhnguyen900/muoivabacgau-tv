<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bác Gấu Phase 2 · WebGL Living Gate</title>
<style>
html,body{margin:0;background:#100e0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial;height:100%}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;box-sizing:border-box}.stage{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 45% 35%,#233447,#111821 60%,#0d0d0b);min-height:calc(100vh - 32px)}#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}.badge{position:absolute;left:20px;top:20px;padding:10px 14px;border-radius:999px;background:#120f0ccc;font-weight:800;z-index:3}.bubble{position:absolute;left:24px;right:24px;bottom:24px;background:#120f0cdd;border:1px solid #ffffff1c;border-radius:18px;padding:16px 18px;font-size:22px;z-index:3;backdrop-filter:blur(12px)}.side{background:#211b15;border-radius:24px;padding:20px}.side h1{margin-top:0}.gate{padding:12px;border-radius:14px;background:#ffffff0a;margin:10px 0}.ok{color:#8fd197}button{width:100%;padding:14px;border:0;border-radius:14px;background:#e0b568;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer}audio{width:100%;margin:8px 0 16px}.state{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cdbfae;white-space:pre-wrap;max-height:220px;overflow:auto}.mini{font-size:12px;color:#aa9d8c;margin-top:6px}@media(max-width:900px){.app{grid-template-columns:1fr}.stage{min-height:68vh}.side{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="badge">BODY ↔ BRAIN · WebGL living gate</div>
    <div class="bubble" id="bubble">Bác đang xếp sách. Bác chưa biết Muối đã về.</div>
  </section>
  <aside class="side">
    <h1>Bác Gấu Phase 2</h1>
    <div class="gate" id="visualStatus">3D: đang khởi tạo WebGL…</div>
    <div class="mini">Không dùng ảnh nền/Base64. Cảnh và nhân vật được dựng trực tiếp bằng 3D runtime.</div>
    <button id="viBtn">🔊 Test tiếng Việt</button>
    <audio id="viAudio" controls preload="auto" src="./vi-test.mp3"></audio>
    <button id="enBtn">🔊 Test English</button>
    <audio id="enAudio" controls preload="auto" src="./en-test.mp3"></audio>
    <button data-state="welcoming">🏠 Muối về</button>
    <button data-state="gentle">😔 Con buồn</button>
    <button data-state="thinking">🤔 Hỏi khó</button>
    <button data-state="playful">🦖 Khủng long</button>
    <div class="state" id="stateDump">state=booting</div>
  </aside>
</div>
<script src="./brain.js"></script>
<script src="./liveness.js"></script>
<script type="module">
import * as THREE from './three.module.js';

const stage=document.getElementById('stage');
const bubble=document.getElementById('bubble');
const stateDump=document.getElementById('stateDump');
const visualStatus=document.getElementById('visualStatus');
const viAudio=document.getElementById('viAudio');
const enAudio=document.getElementById('enAudio');
document.getElementById('viBtn').onclick=()=>{viAudio.currentTime=0;viAudio.play()};
document.getElementById('enBtn').onclick=()=>{enAudio.currentTime=0;enAudio.play()};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x182430);
scene.fog=new THREE.Fog(0x182430,11,27);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(0,3.45,9.4);camera.lookAt(0,2.0,0);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){visualStatus.textContent='✕ WebGL renderer failed';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffd8b1,0x203040,1.8));
const key=new THREE.DirectionalLight(0xffc58c,4.1);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);
const lamp=new THREE.PointLight(0xffa95e,14,8,2);lamp.position.set(3.7,3.2,1.5);scene.add(lamp);

function mat(color,rough=.82){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m}
function sphere(rx,ry,rz,color,rough=.9){const m=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),mat(color,rough));m.scale.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;return m}
function cyl(r1,r2,h,color){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,28),mat(color,.9));m.castShadow=true;return m}

box(15,.25,12,0x6b4735,0,-.12,0);box(15,7,.2,0x27313b,0,3,-4.9);box(.2,7,10,0x303844,-7.4,3,0);
const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.05,64),mat(0x6e2437,1));rug.scale.z=.66;rug.position.set(0,.05,.5);rug.receiveShadow=true;scene.add(rug);
box(2.7,3.7,.65,0x6a4027,-5.3,1.85,-4.25);
for(let r=0;r<4;r++){box(2.55,.08,.62,0x432918,-5.3,.55+r*.92,-3.9);for(let i=0;i<6;i++){const c=[0xa64c3d,0x4f7a78,0xd5a44f,0x7f5a8d,0x55745c,0x8d6d4b][i];box(.22+.05*(i%2),.55+.12*((i+r)%3),.32,c,-6.2+i*.38,.88+r*.92,-3.55)}}
box(1.65,3.65,.14,0x68472f,5.7,1.82,-4.73);box(.09,.09,.18,0xd6b15a,5.18,1.85,-4.58);
box(4,.72,1.45,0x344b52,2.2,.48,-1.9);box(4,1.25,.55,0x2c4148,2.2,1.25,-2.35);box(.48,1.15,1.45,0x2c4148,.35,.77,-1.9);box(.48,1.15,1.45,0x2c4148,4.05,.77,-1.9);
box(2.4,.16,1.25,0x7b5233,0,1.02,1.7);box(.16,1,.16,0x49301e,-.9,.5,1.35);box(.16,1,.16,0x49301e,.9,.5,1.35);
box(3,2.5,.12,0x111b24,-2.2,3.5,-4.74);box(.08,2.5,.16,0x8f6846,-2.2,3.5,-4.62);box(3,.08,.16,0x8f6846,-2.2,3.5,-4.62);
const moon=new THREE.Mesh(new THREE.SphereGeometry(.35,24,24),new THREE.MeshBasicMaterial({color:0xffe7a3}));moon.position.set(-2.9,4.1,-4.45);scene.add(moon);

function createBear(){
 const g=new THREE.Group();g.position.set(-1.25,0,0);const fur=0x6c452f,muzzle=0xb98964,dark=0x24170f;
 const body=sphere(1.18,1.55,.88,fur);body.position.y=1.55;g.add(body);
 const head=sphere(1.08,1,.95,fur);head.position.set(0,3.28,.02);g.add(head);
 const earL=sphere(.42,.44,.24,fur);earL.position.set(-.72,4.02,-.03);g.add(earL);const earR=earL.clone();earR.position.x=.72;g.add(earR);
 const snout=sphere(.62,.45,.38,muzzle);snout.position.set(0,3.04,.75);g.add(snout);
 const nose=sphere(.22,.16,.13,dark,.5);nose.position.set(0,3.24,1.08);g.add(nose);
 const eyeMat=mat(0x120d09,.35);const eyeL=new THREE.Mesh(new THREE.SphereGeometry(.1,22,16),eyeMat);eyeL.position.set(-.36,3.55,.9);g.add(eyeL);const eyeR=eyeL.clone();eyeR.position.x=.36;g.add(eyeR);
 const armL=cyl(.24,.30,1.35,fur);armL.position.set(-1.12,1.7,0);armL.rotation.z=-.2;g.add(armL);const armR=armL.clone();armR.position.x=1.12;armR.rotation.z=.2;g.add(armR);
 const legL=cyl(.36,.42,1,fur);legL.position.set(-.52,.45,0);g.add(legL);const legR=legL.clone();legR.position.x=.52;g.add(legR);
 const mouth=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,12,28,Math.PI),mat(dark,.4));mouth.position.set(0,2.93,1.10);mouth.rotation.z=Math.PI;g.add(mouth);
 g.userData={head,armL,armR,mouth};return g;
}
const bear=createBear();scene.add(bear);
function createRabbit(){const g=new THREE.Group();g.visible=false;g.position.set(5.1,0,-2.9);const fur=0x8d9498,white=0xe5ded2;const body=sphere(.5,.75,.45,fur);body.position.y=.8;g.add(body);const head=sphere(.48,.5,.43,fur);head.position.y=1.7;g.add(head);const e1=sphere(.17,.58,.12,fur);e1.position.set(-.2,2.42,0);e1.rotation.z=-.08;g.add(e1);const e2=e1.clone();e2.position.x=.2;e2.rotation.z=.08;g.add(e2);const sn=sphere(.28,.2,.18,white);sn.position.set(0,1.58,.38);g.add(sn);return g}
const rabbit=createRabbit();scene.add(rabbit);

const stateText={welcoming:'Ủa! Muối về rồi à? Bác mừng con về.',gentle:'Ừ, bác nghe đây. Con kể từ từ cũng được.',thinking:'Hừm… câu này hay đó. Bác nghĩ một chút nha.',playful:'Ồ, khủng long hả? Bác tò mò rồi đó!'};
let state='listening',stateAt=performance.now(),plan=BacGauLiveness.plan({performance:'listening',turn:0,text:'boot',speaking:false});
function applyState(k){state=k;stateAt=performance.now();plan=BacGauLiveness.plan({performance:k,turn:Math.floor(performance.now()),text:stateText[k],speaking:true});bubble.textContent=stateText[k];stateDump.textContent=JSON.stringify(plan,null,2);stage.dataset.state=k;rabbit.visible=k==='playful';}
document.querySelectorAll('[data-state]').forEach(btn=>btn.onclick=()=>applyState(btn.dataset.state));

function resize(){const r=stage.getBoundingClientRect();const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();addEventListener('resize',resize);
const clock=new THREE.Clock();let frames=0;
function animate(){
 const t=clock.getElapsedTime(),u=bear.userData;
 bear.position.y=.025*Math.sin(t*2.2);u.head.rotation.z=.018*Math.sin(t*1.4);u.armL.rotation.z=-.2+.025*Math.sin(t*1.7);u.armR.rotation.z=.2-.025*Math.sin(t*1.5);u.mouth.scale.y+=(1-u.mouth.scale.y)*.12;
 if(state==='welcoming'){bear.rotation.y=.10+.05*Math.sin(t*2.4);u.head.rotation.y=.20;u.armL.rotation.z=-.55+.14*Math.sin(t*3.5);u.mouth.scale.y=.65+.4*Math.abs(Math.sin(t*6));}
 if(state==='gentle'){bear.rotation.y=.10;u.head.rotation.x=-.11;u.head.rotation.z=.06;u.armR.rotation.z=.34;u.mouth.scale.y=.75+.18*Math.abs(Math.sin(t*4));}
 if(state==='thinking'){bear.rotation.y=.03;u.head.rotation.z=.12*Math.sin(t*1.8);u.head.rotation.x=-.05;u.armR.rotation.z=.66;u.armR.rotation.x=-.35;}
 if(state==='playful'){bear.rotation.y=.14*Math.sin(t*2.2);u.head.rotation.y=.09*Math.sin(t*3.8);u.armL.rotation.z=-.44+.2*Math.sin(t*3);u.armR.rotation.z=.46-.15*Math.sin(t*2.6);u.mouth.scale.y=.5+.55*Math.abs(Math.sin(t*7));rabbit.position.y=.02*Math.sin(t*3.2);}
 if(state==='listening'){bear.rotation.y*=.92;u.head.rotation.x*=.92;u.head.rotation.y*=.92;u.head.rotation.z*=.96;}
 renderer.render(scene,camera);frames++;if(frames===2){window.__BACGAU_READY__=true;visualStatus.innerHTML='<span class="ok">✓ WebGL 3D runtime rendered</span>';stateDump.textContent=JSON.stringify(plan,null,2)}requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
