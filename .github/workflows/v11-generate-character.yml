name: Bác Gấu V11 Generate Mature Character
on:
  push:
    branches: [v11-rigged-character]
    paths:
      - 'v11/reference/**'
      - 'v11/scripts/generate-tripo.mjs'
      - '.github/workflows/v11-generate-character.yml'
  workflow_dispatch:

concurrency:
  group: v11-tripo-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-mature-bac-gau:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-rigged-character
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Tripo secret
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: test -n "$TRIPO_API_KEY"

      - name: Generate mature mentor rigged GLB with Tripo
        id: generate
        working-directory: v11
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        shell: bash
        run: |
          set +e
          node scripts/generate-tripo.mjs reference/bacgau-mature-reference.jpg public/character 2>&1 | tee public/character/generation.log
          status=${PIPESTATUS[0]}
          echo "$status" > public/character/generation-status.txt
          exit "$status"
        continue-on-error: true

      - name: Validate generated GLB
        if: steps.generate.outcome == 'success'
        run: |
          test -s v11/public/character/bac-gau.glb
          test -s v11/public/character/generation-manifest.json
          ls -lh v11/public/character/bac-gau.glb
          cat v11/public/character/generation-manifest.json
          find v11/public/character/animations -maxdepth 1 -type f -name '*.glb' -print 2>/dev/null || true

      - name: Sanitize diagnostic log
        if: always()
        shell: bash
        run: |
          if [ -f v11/public/character/generation.log ]; then
            sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g; s#https://[^ ]*X-Amz-[^ ]*#[PRESIGNED_URL_REDACTED]#g' v11/public/character/generation.log > /tmp/generation.log.safe
            mv /tmp/generation.log.safe v11/public/character/generation.log
          fi

      - name: Commit generation outputs or diagnostics onto latest branch
        if: always()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11/public/character/generation.log v11/public/character/generation-status.txt 2>/dev/null || true
          if [ -s v11/public/character/bac-gau.glb ]; then git add v11/public/character/bac-gau.glb; fi
          if [ -s v11/public/character/generation-manifest.json ]; then git add v11/public/character/generation-manifest.json; fi
          if [ -d v11/public/character/animations ]; then git add v11/public/character/animations; fi
          git commit -m 'chore(v11): record Tripo generation result [skip ci]' || exit 0
          git pull --rebase origin v11-rigged-character
          git push origin HEAD:v11-rigged-character

      - name: Fail workflow if generation failed
        if: steps.generate.outcome != 'success'
        run: exit 1
