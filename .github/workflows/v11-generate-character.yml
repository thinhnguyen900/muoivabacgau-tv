name: Bác Gấu V11 Generate Mature Character
on:
  push:
    branches: [v11-rigged-character]
    paths:
      - 'v11/reference/**'
      - 'v11/scripts/generate-tripo.mjs'
      - '.github/workflows/v11-generate-character.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-mature-bac-gau:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate mature mentor rigged GLB with Tripo
        working-directory: v11
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: node scripts/generate-tripo.mjs reference/bacgau-mature-reference.jpg public/character
      - name: Validate generated GLB
        run: |
          test -s v11/public/character/bac-gau.glb
          ls -lh v11/public/character/bac-gau.glb
          cat v11/public/character/generation-manifest.json
      - name: Commit generated GLB
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11/public/character/bac-gau.glb v11/public/character/generation-manifest.json
          git commit -m 'chore(v11): generate mature mentor Bác Gấu GLB [skip ci]' || exit 0
          git push origin HEAD:v11-rigged-character
# automation retrigger: mature mentor generation
