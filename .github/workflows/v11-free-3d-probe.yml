name: Bác Gấu V11 Free 3D Probe
on:
  push:
    branches: [v11-rigged-character]
    paths:
      - '.github/workflows/v11-free-3d-probe.yml'
      - 'v11/reference/bacgau-mature-reference.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-free-spaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradio client
        run: pip install --disable-pip-version-check --quiet gradio_client
      - name: Probe free public 3D Spaces
        run: |
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          from gradio_client import Client

          spaces = [
              'stabilityai/stable-fast-3d',
              'tencent/Hunyuan3D-2',
          ]
          result = {}
          for space in spaces:
              try:
                  client = Client(space, verbose=False)
                  try:
                      api = client.view_api(return_format='dict', print_info=False)
                  except TypeError:
                      api = client.view_api(return_format='dict')
                  result[space] = {'ok': True, 'api': api}
              except Exception as exc:
                  result[space] = {
                      'ok': False,
                      'error': f'{type(exc).__name__}: {exc}',
                      'trace': traceback.format_exc(limit=3),
                  }
          out = Path('v11/public/character/free-space-api.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          if not any(v.get('ok') for v in result.values()):
              raise SystemExit('No free public 3D Space API reachable')
          PY
      - name: Persist probe evidence
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11/public/character/free-space-api.json
          git commit -m 'test(v11): record free 3D Space API probe [skip ci]' || exit 0
          git pull --rebase origin v11-rigged-character
          git push origin HEAD:v11-rigged-character
