name: Bác Gấu Forge CI
on:
  push:
    branches: [phase2-forge]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forge-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media and QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pillow==12.3.0
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p forge/assets forge/evidence

      - name: Reconstruct verified full-frame visual from repository transport
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          import base64, glob, hashlib, json, io
          parts=sorted(glob.glob('forge/assets/transport-q10.b64.*'))
          assert len(parts)==5, f'expected 5 visual transport chunks, got {parts}'
          encoded=''.join(open(p,'r',encoding='utf-8').read().strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          raw_sha=hashlib.sha256(raw).hexdigest()
          assert len(raw)==25224, len(raw)
          assert raw_sha=='f3a00b5ddfd4e1a1f514a87e7aaf15d6589022413a967cc4dbb4937ab268958b', raw_sha
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          assert im.size==(1280,900), im.size
          out='forge/assets/home-full.jpg'
          im.save(out,format='JPEG',quality=90,optimize=False,progressive=False,subsampling=2)
          data=open(out,'rb').read()
          sha=hashlib.sha256(data).hexdigest()
          assert len(data)==82204, len(data)
          assert sha=='29eb363bafe671a5c29e0d02c14ff38747c62a41777f17d5cd7bed02051ab26f', sha
          verify=Image.open(io.BytesIO(data)); verify.load()
          assert verify.size==(1280,900), verify.size
          evidence={'ok':True,'dimensions':[1280,900],'bytes':len(data),'sha256':sha,'transport_bytes':len(raw),'transport_sha256':raw_sha,'canonical_reference_sha256':'e31134e5344e020ac68d1c9b9f84c20c0320e6dbb3a67432ca56e75a4444ae9e','method':'exact repository transport -> Pillow 12.3.0 JPEG q90 re-encode; visible correctness additionally enforced by Chromium screenshot and pixel gate'}
          with open('forge/evidence/asset-recovery.json','w') as f: json.dump(evidence,f,indent=2)
          print('asset recovery PASS',evidence)
          PY

      - name: Generate explicit locale-bound neural voice fixtures
        run: |
          edge-tts --voice vi-VN-NamMinhNeural --text "Bác nghe đây, Muối. Hôm nay con có chuyện gì vui không?" --write-media forge/assets/vi-test.mp3
          edge-tts --voice en-US-GuyNeural --text "Hello Muối. I am listening. What was the best part of your day?" --write-media forge/assets/en-test.mp3
          python forge/voice-gate.py

      - name: Production brain regression (200+ real cases)
        run: node forge/simulate.js

      - name: Living-character planner regression
        run: node forge/liveness.test.js

      - name: Active runtime contract regression
        run: node forge/runtime-contract.test.js

      - name: Parent Guidance safety and leakage regression
        run: |
          node brain/tests/parent-guidance-pipeline.test.mjs
          node brain/tests/parent-guidance.sim.mjs
          node brain/tests/brain-to-body.test.mjs

      - name: Serve forge gate
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/bacgau-http.log 2>&1 &
          echo $! > /tmp/bacgau-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/forge/review-gate.html >/dev/null && break; sleep 0.5; done

      - name: Real Chromium screenshot, interaction and audio playback gate
        env:
          FORGE_GATE_URL: http://127.0.0.1:4173/forge/review-gate.html
        run: node forge/browser-gate.mjs

      - name: Screenshot pixel regression gate
        run: python forge/visual-pixel-gate.py

      - name: Asset integrity gate
        run: |
          python - <<'PY'
          from PIL import Image
          import hashlib, json
          p='forge/assets/home-full.jpg'
          data=open(p,'rb').read()
          im=Image.open(p); im.load()
          assert im.size==(1280,900), im.size
          assert len(data)==82204 and len(data)>80000, len(data)
          sha=hashlib.sha256(data).hexdigest()
          assert sha=='29eb363bafe671a5c29e0d02c14ff38747c62a41777f17d5cd7bed02051ab26f', sha
          recovery=json.load(open('forge/evidence/asset-recovery.json'))
          assert recovery['sha256']==sha
          evidence={'ok':True,'path':p,'dimensions':list(im.size),'bytes':len(data),'sha256':sha}
          with open('forge/evidence/asset-integrity.json','w') as f: json.dump(evidence,f,indent=2)
          print('asset-integrity PASS', evidence)
          PY

      - name: Write immutable green manifest
        run: |
          python - <<'PY'
          import json, os, datetime
          def read(p):
              with open(p,'r',encoding='utf-8') as f:return json.load(f)
          manifest={
            'ok': True,
            'source_commit': os.environ['GITHUB_SHA'],
            'verified_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'browser': read('forge/evidence/browser-gate.json'),
            'visual': read('forge/evidence/visual-pixel-gate.json'),
            'voice': read('forge/evidence/voice-gate.json'),
            'asset': read('forge/evidence/asset-integrity.json'),
            'rule': 'Only this manifest from a fully green job may authorize review promotion.'
          }
          with open('forge/evidence/green-manifest.json','w',encoding='utf-8') as f:json.dump(manifest,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload forge QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacgau-forge-qa-evidence
          path: |
            forge/evidence/
            forge/assets/home-full.jpg
            forge/assets/vi-test.mp3
            forge/assets/en-test.mp3
          if-no-files-found: warn

      - name: Publish green review bundle to dedicated branch
        if: success()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/forge-green
          cp -r forge/evidence/* /tmp/forge-green/
          cp forge/assets/home-full.jpg /tmp/forge-green/home-full.jpg
          cp forge/assets/vi-test.mp3 /tmp/forge-green/vi-test.mp3
          cp forge/assets/en-test.mp3 /tmp/forge-green/en-test.mp3
          cp forge/brain.js /tmp/forge-green/brain.js
          cp forge/liveness.js /tmp/forge-green/liveness.js
          sed -e 's#\./assets/home-full.jpg#./home-full.jpg#g' -e 's#\./assets/vi-test.mp3#./vi-test.mp3#g' -e 's#\./assets/en-test.mp3#./en-test.mp3#g' forge/review-gate.html > /tmp/forge-green/index.html
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin forge-ci-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/forge-ci-evidence; then
            git checkout -B forge-ci-evidence origin/forge-ci-evidence
          else
            git checkout --orphan forge-ci-evidence
            git rm -rf . || true
          fi
          rm -rf evidence
          mkdir -p evidence
          cp -r /tmp/forge-green/* evidence/
          printf '%s\n' "$SOURCE_SHA" > evidence/source-commit.txt
          git add evidence
          git commit -m "CI green review bundle for ${SOURCE_SHA}" || true
          git push origin forge-ci-evidence --force
