name: Bác Gấu Forge CI
on:
  push:
    branches: [phase2-forge]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forge-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install voice, WebGL and QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pillow
          npm install --no-save playwright@1.55.0 three@0.180.0
          npx playwright install --with-deps chromium
          cp node_modules/three/build/three.module.js forge/three.module.js
          cp node_modules/three/build/three.core.js forge/three.core.js
          mkdir -p forge/assets forge/evidence
          test -s forge/three.module.js
          test -s forge/three.core.js
          grep -q "./three.module.js" forge/review-gate.html

      - name: Generate explicit locale-bound neural voice fixtures
        run: |
          edge-tts --voice vi-VN-NamMinhNeural --text "Bác nghe đây, Muối. Hôm nay con có chuyện gì vui không?" --write-media forge/assets/vi-test.mp3
          edge-tts --voice en-US-GuyNeural --text "Hello Muối. I am listening. What was the best part of your day?" --write-media forge/assets/en-test.mp3
          edge-tts --voice vi-VN-NamMinhNeural --text "Ủa! Muối về rồi à? Bác mừng con về." --write-media forge/assets/scenario-welcoming.mp3
          edge-tts --voice vi-VN-NamMinhNeural --text "Ừ, bác nghe đây. Con kể từ từ cũng được." --write-media forge/assets/scenario-gentle.mp3
          edge-tts --voice vi-VN-NamMinhNeural --text "Hừm, câu này hay đó. Bác nghĩ một chút nha." --write-media forge/assets/scenario-thinking.mp3
          edge-tts --voice vi-VN-NamMinhNeural --text "Ồ, khủng long hả? Bác tò mò rồi đó!" --write-media forge/assets/scenario-playful.mp3
          python forge/voice-gate.py
          for f in forge/assets/scenario-*.mp3; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" | awk '{if ($1 <= 0) exit 1}'
          done

      - name: Production brain regression (200+ real cases)
        run: node forge/simulate.js

      - name: Living-character planner regression
        run: node forge/liveness.test.js

      - name: Active runtime contract regression
        run: node forge/runtime-contract.test.js

      - name: Parent Guidance safety and leakage regression
        run: |
          node brain/tests/parent-guidance-pipeline.test.mjs
          node brain/tests/parent-guidance.sim.mjs
          node brain/tests/brain-to-body.test.mjs

      - name: Serve forge gate and verify every runtime resource
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/bacgau-http.log 2>&1 &
          echo $! > /tmp/bacgau-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/forge/review-gate.html >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:4173/forge/brain.js >/dev/null
          curl -fsS http://127.0.0.1:4173/forge/liveness.js >/dev/null
          curl -fsS http://127.0.0.1:4173/forge/three.module.js >/dev/null
          curl -fsS http://127.0.0.1:4173/forge/three.core.js >/dev/null
          curl -fsS http://127.0.0.1:4173/forge/assets/vi-test.mp3 >/dev/null
          curl -fsS http://127.0.0.1:4173/forge/assets/en-test.mp3 >/dev/null
          for f in scenario-welcoming scenario-gentle scenario-thinking scenario-playful; do curl -fsS "http://127.0.0.1:4173/forge/assets/${f}.mp3" >/dev/null; done

      - name: Real Chromium WebGL, interaction and audio playback gate
        env:
          FORGE_GATE_URL: http://127.0.0.1:4173/forge/review-gate.html
        run: node forge/browser-gate.mjs

      - name: Screenshot pixel regression gate
        run: python forge/visual-pixel-gate.py

      - name: Write immutable green manifest
        run: |
          python - <<'PY'
          import json, os, datetime
          def read(p):
              with open(p,'r',encoding='utf-8') as f:return json.load(f)
          manifest={
            'ok':True,
            'source_commit':os.environ['GITHUB_SHA'],
            'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'browser':read('forge/evidence/browser-gate.json'),
            'visual':read('forge/evidence/visual-pixel-gate.json'),
            'voice':read('forge/evidence/voice-gate.json'),
            'render':{'mode':'procedural-webgl-threejs','binary_image_transport':False},
            'rule':'Only this manifest from a fully green job may authorize review promotion.'
          }
          with open('forge/evidence/green-manifest.json','w',encoding='utf-8') as f:json.dump(manifest,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload forge QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacgau-forge-qa-evidence
          path: |
            forge/evidence/
            forge/assets/vi-test.mp3
            forge/assets/en-test.mp3
            forge/assets/scenario-*.mp3
          if-no-files-found: warn

      - name: Publish green review bundle to dedicated branch
        if: success()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/forge-green
          cp -r forge/evidence/* /tmp/forge-green/
          cp forge/assets/vi-test.mp3 /tmp/forge-green/vi-test.mp3
          cp forge/assets/en-test.mp3 /tmp/forge-green/en-test.mp3
          cp forge/assets/scenario-*.mp3 /tmp/forge-green/
          cp forge/brain.js /tmp/forge-green/brain.js
          cp forge/liveness.js /tmp/forge-green/liveness.js
          cp forge/three.module.js /tmp/forge-green/three.module.js
          cp forge/three.core.js /tmp/forge-green/three.core.js
          sed -e 's#\./assets/vi-test.mp3#./vi-test.mp3#g' -e 's#\./assets/en-test.mp3#./en-test.mp3#g' -e 's#\./assets/scenario-#./scenario-#g' forge/review-gate.html > /tmp/forge-green/index.html
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin forge-ci-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/forge-ci-evidence; then
            git checkout -B forge-ci-evidence origin/forge-ci-evidence
          else
            git checkout --orphan forge-ci-evidence
            git rm -rf . || true
          fi
          rm -rf evidence
          mkdir -p evidence
          cp -r /tmp/forge-green/* evidence/
          printf '%s\n' "$SOURCE_SHA" > evidence/source-commit.txt
          git add evidence
          git commit -m "CI green WebGL review bundle for ${SOURCE_SHA}" || true
          git push origin forge-ci-evidence --force
